worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ──────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow large file uploads (signature images, PDFs)
    client_max_body_size 10M;

    # ── Gzip Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/x-font-ttf font/opentype image/svg+xml;

    # ── Security Headers ─────────────────────────────────────────
    # These headers protect against common web vulnerabilities.
    # Applied via the add_header directive in the server block.

    # ── Upstream Definitions ──────────────────────────────────────
    # Using Docker's internal DNS — service names resolve automatically
    # within the docsign-network Docker network.
    upstream auth_backend {
        server auth-service:8001;
        keepalive 16;
    }

    upstream document_backend {
        server document-service:8002;
        keepalive 16;
    }

    upstream notify_backend {
        server notification-service:8003;
        keepalive 16;
    }

    upstream frontend_backend {
        server frontend:80;
        keepalive 16;
    }

    # ── Main Server Block ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers on all responses
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ── Auth Service ──────────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://auth_backend/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Forward the real client IP so rate limiting works correctly
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # Users and Roles routes (part of auth service)
        location /api/users/ {
            proxy_pass http://auth_backend/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/roles/ {
            proxy_pass http://auth_backend/roles/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Document Service ──────────────────────────────────────
        location /api/documents/ {
            proxy_pass http://document_backend/documents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Extended timeout for PDF generation (can take several seconds)
            proxy_read_timeout 120s;
        }

        # ── Notification Service ──────────────────────────────────
        location /api/notify/ {
            proxy_pass http://notify_backend/notify/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Swagger Docs (passthrough to each service) ────────────
        location /api/auth/docs {
            proxy_pass http://auth_backend/docs;
            proxy_set_header Host $host;
        }
        location /api/documents/docs {
            proxy_pass http://document_backend/docs;
            proxy_set_header Host $host;
        }

        # ── Frontend — catch all ──────────────────────────────────
        # This must be last — all non-API routes go to the React SPA
        location / {
            proxy_pass http://frontend_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Required for React Router — serve index.html for all routes
            proxy_intercept_errors on;
        }
    }
}
