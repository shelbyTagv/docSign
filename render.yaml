services:
  # ─────────────────────────────────────────────────────────
  # Auth Service
  # ─────────────────────────────────────────────────────────
  - type: web
    name: docsign-auth-service
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r auth-service/requirements.txt
    startCommand: gunicorn --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT auth-service.app.main:app
    rootDir: .
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: DB_TYPE
        value: postgresql
      - key: DB_HOST
        value: acela.proxy.rlwy.net
      - key: DB_PORT
        value: "59853"
      - key: DB_NAME
        value: railway
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        value: FFRcvuhsnQzlAYIMnyvGLMhxjNPDSnYS
      - key: FERNET_KEY
        value: Bmz2Q6jt_-EkjrmixnWlbM7A022qXfELLCbhhclv4TY=
      - key: INTERNAL_API_KEY
        value: 47wbV0v8MrmCbQ5Cp7Ym8WTGjXpTfFo4Dp4htq4K1Ow
      - key: SERVICE_PORT
        value: "8001"
      - key: JWT_ALGORITHM
        value: RS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: NOTIFICATION_SERVICE_URL
        value: https://docsign-notification-service.onrender.com
      - key: CORS_ORIGINS
        value: https://docsign.vercel.app
      - key: FRONTEND_URL
        value: https://docsign.vercel.app

